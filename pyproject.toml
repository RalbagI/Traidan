[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "traidan"
version = "0.1.0"
license = "MIT"
description = "LLM-only equity dry-run trading system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5,<8",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["intelligence"]

[tool.maturin]
python-source = "intelligence"
module-name = "traidan._rust"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "typings:intelligence"
explicit_package_bases = true
disallow_any_unimported = true
