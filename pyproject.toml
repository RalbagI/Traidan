[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "traderalbag"
version = "0.1.0"
description = "AI-Driven Cryptocurrency Algorithmic Trading Engine"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "polars>=0.20",
    "pyarrow>=16",
    "pyzmq>=26",
    "questdb>=1.1",
    "mlflow>=2.13",
    "wandb>=0.17",
    "streamlit>=1.35",
    "httpx>=0.27",
    "anthropic>=0.28",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.maturin]
python-source = "intelligence"
module-name = "traderalbag._rust"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
