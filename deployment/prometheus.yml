global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: traderalbag_rust
    static_configs:
      - targets: ["host.docker.internal:9100"]
    metrics_path: /metrics

  - job_name: questdb
    static_configs:
      - targets: ["questdb:9003"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
